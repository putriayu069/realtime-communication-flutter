syntax = "proto3";

package monitoring;

// Layanan komunikasi sensor
service SensorService {
  // Unary RPC: satu request, satu response
  rpc GetLatest (SensorRequest) returns (SensorReading);

  // Server Streaming: satu request, banyak response
  rpc WatchSensor (SensorRequest) returns (stream SensorReading);
}

// Pesan permintaan data sensor
message SensorRequest {
  string device_id = 1;
}

// Pesan hasil pembacaan sensor
message SensorReading {
  string device_id = 1;
  double value = 2;
  int64 timestamp = 3;
}
